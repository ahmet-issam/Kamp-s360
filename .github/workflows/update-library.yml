name: Update official library feed
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python -m unittest discover -s tests -p test_collect_library.py
      - run: python scripts/collect_library.py
      - name: Commit refreshed public source data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/library.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official library information'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
