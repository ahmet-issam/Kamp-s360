name: Update campus meals
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  push:
    paths:
      - scripts/collect_meals.py
      - tests/test_collect_meals.py
      - .github/workflows/update-meals.yml
  pull_request:
    paths:
      - scripts/collect_meals.py
      - tests/test_collect_meals.py
      - .github/workflows/update-meals.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  update:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: campus-meals-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Collect official menu
        run: python scripts/collect_meals.py
      - name: Save verified menu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/meals.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official cafeteria menu'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
